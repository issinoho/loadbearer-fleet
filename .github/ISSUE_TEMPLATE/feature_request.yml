name: Feature request
description: Suggest something this should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The [Roadmap](https://github.com/issinoho/loadbearer-fleet#roadmap) in
        the README shows what is already planned or deliberately out of scope.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out about your estate?
      description: |
        The problem rather than the feature, if you can — this project has
        turned out better when it started from "I need to know which machines
        got slower" than from "add a chart".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you have it do?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Your setup
      description: |
        Roughly how many machines, how they are grouped, what your deployment
        tool is, and whether you tag results. Scale and grouping change the
        answer more than anything else here.
