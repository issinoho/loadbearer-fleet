name: CI

# Format, lint and test on every push to main and every pull request. Mirrors
# loadbearer's own CI so the two repos fail the same way, with one addition:
# the dashboard's charts are checked as well as the Rust.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything back.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Add clippy and rustfmt
        run: rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        # One canonical formatting check is enough; skip it on the second OS.
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      # Both platforms matter here and not just for the tests: the Windows
      # service integration is behind `cfg(windows)` and the fallbacks that
      # replace it are behind `cfg(not(windows))`, so each build only ever
      # compiles one of the two. Whichever OS you skip is the one that breaks.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  # `rust-version` in Cargo.toml is a promise, and a promise nothing checks is
  # one that quietly stops being true — usually not because of anything in this
  # crate but because a dependency raised its own floor, which a `cargo update`
  # does silently.
  #
  # `check` rather than `clippy`, because clippy's lint set moves between
  # releases: a new lint would fail this job for a reason that has nothing to do
  # with the minimum version compiling. `--locked` because the committed
  # lockfile is what actually gets built.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Both platforms, because each build compiles a different crate set and a
      # different set of source: `windows-service` and its own dependencies
      # exist only on Windows, and the service integration behind
      # `cfg(windows)` is swapped for the fallbacks behind `cfg(not(windows))`.
      # Neither platform's floor implies the other's.
      #
      # (TLS is not one of the differences — this tree is rustls on both, with
      # no openssl-sys and no schannel.)
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in step with `rust-version` in Cargo.toml.
          toolchain: '1.88'

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check against the declared minimum
        run: cargo check --all-targets --locked

  # The charts are hand-rolled SVG with no framework to catch a mistake, so
  # they get rendered against a minimal DOM and the geometry asserted: no NaN
  # reaching an attribute (which drops a mark silently rather than erroring),
  # nothing painted outside its own box, bars within spec, hit targets big
  # enough to hit. It needs Node, which the server itself does not, so it is a
  # separate job rather than a step in the matrix above.
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The check builds its snapshot by running the binary over the
      # anonymised fixtures, so that it cannot drift from the real API.
      - name: Build
        run: cargo build --locked

      - name: Check the dashboard
        run: node scripts/check-ui.mjs
