name: Build and publish release binaries

# Fires on every version tag push (v0.1.0, v0.2.0, ...): build a self-contained
# binary for Windows and Linux, archive each with the docs, and attach both to
# the GitHub Release for that tag.
#
# A manual workflow_dispatch run builds the same artifacts (downloadable from
# the run page) but only publishes a Release if publish_release is ticked, so a
# candidate can be tried on a real management server without leaving a public
# Release behind.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release from this run (leave unchecked for a throwaway test build)"
        type: boolean
        default: false

permissions:
  contents: write
  # For actions/attest-build-provenance: mint an OIDC token and write the
  # attestation to the repo.
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: loadbearer-fleet.exe
            archive: zip
          # Deliberately not ubuntu-latest. A binary linked against a newer
          # glibc will not start on an older one, and this is a service that
          # lands on whatever the estate already runs — so the oldest
          # still-supported runner sets the floor and buys the widest
          # compatibility. Nothing here needs anything newer, and there is no
          # OpenSSL in the tree to complicate it: TLS is rustls.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: loadbearer-fleet
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Worth running on the artifact that ships rather than only on a debug
      # build: the release profile turns on LTO, and the dashboard's assets are
      # compiled into the binary, so this is the first time the thing being
      # published is asked to produce a snapshot at all.
      - name: Smoke-test the built binary
        shell: bash
        run: |
          set -euo pipefail
          exe="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          "$exe" --version
          db="$(mktemp -d)/smoke.db"
          "$exe" --index "$db" --log-level warn scan tests/fixtures
          "$exe" --index "$db" --log-level warn report --json > snapshot.json
          # A report that parsed but found nothing would pass a --version check
          # and fail every user.
          machines="$(node -e 'const s=require("./snapshot.json");console.log(s.summary.machines)')"
          echo "machines in the smoke snapshot: $machines"
          [ "$machines" -ge 4 ] || { echo "::error::the fixtures produced $machines machines"; exit 1; }
          rm snapshot.json

      # No CI code signing: the Certum SimplySign cloud cert has no unattended
      # API — it only unlocks through a SimplySign Desktop session, which needs
      # a persistent, already-authenticated machine rather than a fresh hosted
      # runner. CI always ships this exe unsigned. See loadbearer's
      # CODE_SIGNING_POLICY.md for the same constraint and the manual flow that
      # answers it.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # Tag push -> version is the tag without the leading "v".
          # Manual run off a branch -> fall back to Cargo.toml + "-dev".
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-dev"
          fi
          name="loadbearer-fleet-${version}-${{ matrix.target }}"
          mkdir -p "staging/${name}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "staging/${name}/"
          cp README.md LICENSE CHANGELOG.md "staging/${name}/"
          # A starter config beside the binary, generated by the binary itself
          # so it cannot drift from what the loader accepts.
          "target/${{ matrix.target }}/release/${{ matrix.bin }}" init-config \
            > "staging/${name}/loadbearer-fleet.example.toml"
          cd staging
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" "${name}" >/dev/null
          else
            tar czf "../${name}.tar.gz" "${name}"
          fi

      # Signed build-provenance attestation for the release archive: ties it to
      # this exact workflow run, commit and repository. Verifiable with no
      # certificate via
      # `gh attestation verify <file> --repo issinoho/loadbearer-fleet`
      # (the trust root is GitHub's Sigstore instance).
      - name: Attest build provenance
        # Skip on a throwaway workflow_dispatch build, so a test run leaves no
        # public attestation behind.
        if: github.event_name == 'push' || inputs.publish_release
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            loadbearer-fleet-*.zip
            loadbearer-fleet-*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            loadbearer-fleet-*.zip
            loadbearer-fleet-*.tar.gz
          if-no-files-found: error

  release:
    needs: [build]
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-latest
    env:
      # Detached GPG signature over SHA256SUMS. A no-op when unset, which it
      # is until the secrets are added.
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7

      - name: Pull this version's CHANGELOG section for the release body
        # Tolerant of a non-version ref (a manual run off a branch): an
        # unmatched version just leaves the file empty and the Release falls
        # back to GitHub's auto-generated notes.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## " ver "( |$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts into one directory
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp {} release-assets/ \;
          ls -l release-assets

      - name: Checksums
        # SHA256SUMS covers each archive *and* the bare executable inside it —
        # the exe hash is what a WDAC or AppLocker file-hash allow rule needs,
        # since hash rules permit an unsigned binary and publisher rules don't.
        run: |
          cd release-assets
          sha256sum *.zip *.tar.gz > SHA256SUMS
          for z in *.zip; do
            unzip -p "$z" '*/loadbearer-fleet.exe' | sha256sum \
              | sed "s#-#loadbearer-fleet.exe  (inside $z)#" >> SHA256SUMS
          done
          for t in *.tar.gz; do
            tar -xzOf "$t" --wildcards '*/loadbearer-fleet' | sha256sum \
              | sed "s#-#loadbearer-fleet  (inside $t)#" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Sign SHA256SUMS with GPG
        # Detached and ASCII-armored, covering every archive and the bare
        # executable inside each. Unlike loadbearer, nothing rewrites these
        # checksums after publication, so this signature stays valid — if that
        # ever changes, the stale .asc has to be dropped rather than left to
        # fail verification silently.
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor release-assets/SHA256SUMS
          gpg --verify release-assets/SHA256SUMS.asc release-assets/SHA256SUMS

      - name: Note when shipping without a GPG signature
        if: env.GPG_PRIVATE_KEY == ''
        run: echo "GPG_PRIVATE_KEY not set - SHA256SUMS ships unsigned."

      - name: Create/update the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "loadbearer-fleet ${{ github.ref_name }}"
          body_path: release-notes.md
          generate_release_notes: true
          files: release-assets/*
