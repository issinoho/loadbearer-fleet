[package]
name = "loadbearer-fleet"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fleet dashboard for loadbearer: indexes collected result files and reports across an estate"
license = "MIT"

[dependencies]
# Web
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "set-header"] }

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.11"
walkdir = "2"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }

# Plumbing
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
