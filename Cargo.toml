[package]
name = "loadbearer-fleet"
version = "0.5.5"
edition = "2024"
rust-version = "1.88"
# Declared rather than left to auto-detection, so it is visible here that the
# binary carries a stamped build identity.
build = "build.rs"
description = "Fleet dashboard for loadbearer: indexes collected result files and reports across an estate"
license = "MIT"

[dependencies]
# Web
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "set-header"] }

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
walkdir = "2"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }

# Plumbing
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "1.1.5"
rand = "0.10.2"
openidconnect = { version = "4.0.1", features = ["reqwest"] }
base64 = "0.23.1"
tracing-appender = "0.2.5"
flate2 = "1.1.10"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
