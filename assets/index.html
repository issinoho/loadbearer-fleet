<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loadbearer fleet</title>
<!--
  Nothing here loads from anywhere but this origin: no CDN, no font service, no
  analytics. The binary carries its own assets, so the dashboard works on an
  air-gapped management network and the server can send
  `default-src 'self'` and mean it.
-->
<link rel="stylesheet" href="/app.css">
<!-- SVG rather than .ico: it is text, so it compiles into the binary with
     everything else, and it scales to whatever size the browser or the pinned
     tab wants. -->
<link rel="icon" type="image/svg+xml" href="/logo-mark.svg">
</head>
<!-- data-palette lists the hexes used as marks, so the dataviz validator can be
     pointed at this page directly rather than at a copy of the list. -->
<body data-palette="#2a78d6,#e34948,#d03b3b,#fab219,#898781">

<header class="topbar">
  <div class="brand">
    <img class="brand-mark" src="/logo-mark.svg" alt="" width="22" height="22">
    <span class="brand-name">loadbearer <b>fleet</b></span>
  </div>

  <nav class="tabs" id="tabs" aria-label="Views">
    <button type="button" class="tab" data-view="overview" aria-current="page">Overview</button>
    <button type="button" class="tab" data-view="cohorts">Cohorts</button>
    <button type="button" class="tab" data-view="machines">Machines</button>
  </nav>

  <div class="topbar-actions">
    <span class="meta" id="generated"></span>
    <span class="chip" id="who" hidden></span>
    <button type="button" class="btn" id="rescan">Rescan folder</button>
    <!-- A POST, so a link someone is tricked into following cannot sign them
         out. No JavaScript needed, and it satisfies form-action 'self'. -->
    <form method="post" action="/auth/logout" id="signout" hidden>
      <button type="submit" class="btn">Sign out</button>
    </form>
    <button type="button" class="btn btn-square" id="theme" aria-label="Switch between light and dark">
      <span aria-hidden="true">&#9681;</span>
    </button>
  </div>
</header>

<!-- One filter row, above everything it scopes. The server applies it, so the
     summary, the charts and the tables can never disagree with each other. -->
<form class="filters" id="filters" aria-label="Filter the fleet">
  <label class="field">
    <span class="field-label">Measured</span>
    <select name="since_days" id="f-since">
      <option value="">Any time</option>
      <option value="7">Last 7 days</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
      <option value="365">Last year</option>
    </select>
  </label>

  <span id="f-tags" class="tag-filters"></span>

  <label class="field">
    <span class="field-label">Finding</span>
    <select name="flag" id="f-flag">
      <option value="">Any</option>
    </select>
  </label>

  <label class="field field-grow">
    <span class="field-label">Search</span>
    <input type="search" name="q" id="f-q" placeholder="Hostname, serial, asset tag or CPU"
           autocomplete="off" spellcheck="false">
  </label>

  <button type="button" class="btn btn-quiet" id="f-reset">Clear</button>
  <span class="filter-count" id="f-count"></span>
</form>

<main id="main"></main>

<!-- The build goes here rather than in the topbar: it is the answer to "which
     version am I looking at" when something is being reported, not something
     to read on the way past. Filled from the snapshot, so it names the build
     that produced what is on screen. -->
<footer class="footer">
  <span id="footer-note"></span>
  <span class="footer-build" id="footer-build"></span>
</footer>

<div class="tooltip" id="tooltip" role="status" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
